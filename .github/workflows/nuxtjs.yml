# Build the Nuxt site as static files and host it on GitHub Pages
# (custom domain: ritikatamrakar.com.np, from public/CNAME).
#
# Runs on every push to main, and can be started by hand from the Actions tab.
# One-time setup: repo Settings > Pages > Build and deployment > Source:
# "GitHub Actions".
#
# Docs: https://nuxt.com/deploy/github-pages
name: Deploy Nuxt site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Allow the job to publish to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits rather than cancelling a live deploy
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run generate
        env:
          NITRO_PRESET: github_pages

      # Fail early if the build is missing anything the live site needs
      - name: Check build output
        run: |
          for f in index.html 404.html CNAME .nojekyll projects/index.html about/index.html; do
            test -f ".output/public/$f" || { echo "Missing $f in the build"; exit 1; }
          done
          echo "Build output looks complete."

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./.output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
